          type: string
          format: uuid
        sevakCode:
          type: string
          description: Format {firstInitial}{lastInitial}2026{zero-padded sequence} (e.g. nb202601)
          example: nb202601
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        altMobile:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        address:
          type: string
        mandal:
          type: string
        kshetra:
          type: string
        expectedContacts:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SevakResponse:
      type: object
      required:
        - sevak
      properties:
        sevak:
          $ref: '#/components/schemas/Sevak'

    SevakSearchResponse:
      type: object
      required:
