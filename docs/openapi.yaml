        distributedBig:
          type: integer
        distributedBiscuit:
          type: integer
        distributedChocolate:
          type: integer
        collectedByName:
          type: string
          nullable: true
        collectedByMobile:
          type: string
          nullable: true
        distributedAt:
          type: string
          format: date-time
          nullable: true
        distributedBy:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    PrasadDistributeResponse:
      type: object
      required:
