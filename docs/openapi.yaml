openapi: 3.0.3
info:
  title: BAPS Anand Jamo Ne Jamadu Seva Portal API
  description: Module 3 (Books & Receipts) OpenAPI specification
  version: 3.0.0
  contact:
    name: BAPS Anand Mandir

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

security:
  - CookieAuth: []
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: Authenticate a user and receive a JWT
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts from this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get the current authenticated user
      operationId: getMe
      tags:
        - Auth
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/users:
    get:
      summary: List all users (SUPER_ADMIN only)
      operationId: listUsers
      tags:
        - Auth
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new user (SUPER_ADMIN only)
      operationId: createUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks:
    post:
      summary: Register a new sevak
      operationId: createSevak
      tags:
        - Sevaks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSevakRequest'
      responses:
        '201':
          description: Sevak registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mobile or WhatsApp already registered to another sevak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks:
    get:
      summary: Search sevaks by code, mobile, or name (alias of /sevaks/search)
      operationId: listSevaks
      tags:
        - Sevaks
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakSearchResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/search:
    get:
      summary: Search sevaks by code, mobile, or name
      operationId: searchSevaks
      tags:
        - Sevaks
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakSearchResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/export/excel:
    get:
      summary: Download all sevaks as an Excel file
      operationId: exportSevaksExcel
      tags:
        - Sevaks
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/export/books-summary:
    get:
      summary: Download Sevak book allocations as an Excel file
      operationId: exportSevakBooksSummary
      tags:
        - Sevaks
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '429':
          description: Too many requests from this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/book-records:
    get:
      summary: Get paginated sevak book records with allocation aggregates
      operationId: getSevakBookRecords
      tags:
        - Sevaks
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: mandal
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: Paginated sevak book records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakBookRecordsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/export/book-records:
    get:
      summary: Download itemized sevak book records as a formatted multi-sheet Excel file
      operationId: exportSevakBookRecords
      tags:
        - Sevaks
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: mandal
          schema:
            type: string
      responses:
        '200':
          description: Excel file download (Book-Level Breakdown sheet per assigned book and Sevak Master Summary sheet per sevak)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '429':
          description: Too many requests from this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/{id}:
    put:
      summary: Update a sevak
      operationId: updateSevak
      tags:
        - Sevaks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSevakRequest'
      responses:
        '200':
          description: Sevak updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mobile or WhatsApp already registered to another sevak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a sevak
      operationId: deleteSevak
      tags:
        - Sevaks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sevak deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Sevak has active donation receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/batch-assign:
    post:
      summary: Assign multiple unique book numbers to a sevak
      operationId: batchAssignBooks
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAssignBooksRequest'
      responses:
        '201':
          description: Books assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAssignBooksResponse'
        '400':
          description: Validation error or duplicate book numbers within the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: One or more book numbers already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/{bookId}:
    put:
      summary: Update a book number
      operationId: updateBook
      tags:
        - Books
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book number updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Book allocation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Book number already assigned elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a book allocation
      operationId: deleteBook
      tags:
        - Books
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book allocation deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Book has existing logged receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Book allocation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/sevak/{sevakId}:
    get:
      summary: List books assigned to a sevak
      operationId: getBooksBySevak
      tags:
        - Books
      parameters:
        - in: path
          name: sevakId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: List of book allocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/{bookNumber}:
    get:
      summary: Get a single book allocation by book number
      operationId: getBookByNumber
      tags:
        - Books
      parameters:
        - in: path
          name: bookNumber
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book allocation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts:
    post:
      summary: Create one or many receipts
      operationId: createReceipts
      tags:
        - Receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptsRequest'
      responses:
        '201':
          description: Receipts created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Receipt already exists in the same book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/search:
    get:
      summary: Search receipts by book, number, donor, mobile, sevak code, or Sah-Sevak
      operationId: searchReceipts
      tags:
        - Receipts
      parameters:
        - in: query
          name: bookNumber
          schema:
            type: string
        - in: query
          name: receiptNo
          schema:
            type: string
        - in: query
          name: donorName
          schema:
            type: string
        - in: query
          name: donorMobile
          schema:
            type: string
        - in: query
          name: sevakCode
          description: Filter receipts by Sevak 6-character code (case-insensitive substring)
          schema:
            type: string
        - in: query
          name: sahSevakName
          description: Filter by Sah-Sevak (co-volunteer) name
          schema:
            type: string
        - in: query
          name: sahSevakMobile
          description: Filter by Sah-Sevak (co-volunteer) mobile
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: Paginated receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSearchResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/sevak/{sevakId}/summary:
    get:
      summary: Real-time receipt aggregation for a sevak
      operationId: getSevakReceiptSummary
      tags:
        - Receipts
      parameters:
        - in: path
          name: sevakId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary with denomination breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSummaryResponse'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/sevak/{sevakId}:
    get:
      summary: List all receipts for a sevak with book metadata
      operationId: getSevakReceipts
      tags:
        - Receipts
      parameters:
        - in: path
          name: sevakId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 20
              - 50
      responses:
        '200':
          description: List of receipts with sevak and book metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakReceiptsResponse'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/{receiptId}:
    put:
      summary: Update a single receipt
      operationId: updateReceipt
      tags:
        - Receipts
      parameters:
        - in: path
          name: receiptId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReceiptBody'
      responses:
        '200':
          description: Receipt updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Receipt number already exists in this book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a single receipt
      operationId: deleteReceipt
      tags:
        - Receipts
      parameters:
        - in: path
          name: receiptId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/bulk-sync:
    post:
      summary: Synchronize receipt updates and additions for a sevak
      operationId: bulkSyncReceipts
      tags:
        - Receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSyncRequest'
      responses:
        '200':
          description: Receipts synchronized with aggregate summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSyncResponse'
        '400':
          description: Validation error or duplicate bookNumber + receiptNo in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Receipt already exists in the same book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/export/excel:
    get:
      summary: Export filtered receipts with Sah-Sevak columns and a summary sheet
      operationId: exportReceiptsExcel
      tags:
        - Receipts
      parameters:
        - in: query
          name: bookNumber
          schema:
            type: string
        - in: query
          name: receiptNo
          schema:
            type: string
        - in: query
          name: donorName
          schema:
            type: string
        - in: query
          name: donorMobile
          schema:
            type: string
        - in: query
          name: sevakCode
          schema:
            type: string
        - in: query
          name: sahSevakName
          schema:
            type: string
        - in: query
          name: sahSevakMobile
          schema:
            type: string
      responses:
        '200':
          description: Excel file download (Receipts sheet with Book No, Receipt No, Donor Name, Donor Mobile, Amount, Sevak Code, Sevak Full Name, Sah-Sevak Name, Sah-Sevak Mobile, Date; plus Summary sheet)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prasad/summary:
    get:
      summary: Get live book-level prasad eligibility and distribution summary
      description: >-
        Returns one row per allocated book with item-wise eligible, distributed
        and remaining quantities computed from receipt slab rules, plus desk-wide
        aggregate totals and the list of mandals for filtering.
      operationId: getPrasadSummary
      tags:
        - Prasad
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Matches sevak code, name, mobile, book number, sah-sevak name or mobile
        - in: query
          name: sevakCode
          schema:
            type: string
        - in: query
          name: sevakName
          schema:
            type: string
        - in: query
          name: mobile
          schema:
            type: string
        - in: query
          name: sahSevakName
          schema:
            type: string
        - in: query
          name: sahSevakMobile
          schema:
            type: string
        - in: query
          name: mandal
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, PENDING, COMPLETED]
            default: ALL
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            enum: [5, 10, 20, 50]
            default: 10
      responses:
        '200':
          description: Paginated book rows with aggregate item totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrasadSummaryResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prasad/distribute:
    post:
      summary: Record prasad distribution for a sevak's book
      description: >-
        Increments the distributed item counts for the (sevakId, bookNumber)
        pair. Requested quantities are validated against the remaining eligible
        quantities computed from that book's receipts.
      operationId: distributePrasad
      tags:
        - Prasad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrasadDistributeRequest'
      responses:
        '200':
          description: Distribution recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrasadDistributeResponse'
        '400':
          description: Validation or over-allocation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sevak not found or book not allocated to sevak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prasad/export:
    get:
      summary: Download Prasad Vitran records Excel workbook
      description: >-
        Exports the same filtered book-level rows as /prasad/summary into a
        formatted workbook named Prasad_Vitran_Records_2026.xlsx.
      operationId: exportPrasadExcel
      tags:
        - Prasad
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sevakCode
          schema:
            type: string
        - in: query
          name: sevakName
          schema:
            type: string
        - in: query
          name: mobile
          schema:
            type: string
        - in: query
          name: sahSevakName
          schema:
            type: string
        - in: query
          name: sahSevakMobile
          schema:
            type: string
        - in: query
          name: mandal
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, PENDING, COMPLETED]
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/stats:
    get:
      summary: Get executive analytics dashboard stats
      operationId: getDashboardStats
      tags:
        - Dashboard
      responses:
        '200':
          description: Aggregated dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    CreateUserRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - VOLUNTEER

    User:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - VOLUNTEER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    CreateSevakRequest:
      type: object
      required:
        - fullName
        - firstName
        - lastName
        - mobile
        - address
        - mandal
        - kshetra
        - expectedContacts
      properties:
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        altMobile:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        address:
          type: string
        mandal:
          type: string
        kshetra:
          type: string
        expectedContacts:
          type: integer
          minimum: 0

    UpdateSevakRequest:
      type: object
      required:
        - fullName
        - firstName
        - lastName
        - mobile
        - address
        - mandal
        - kshetra
        - expectedContacts
      properties:
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        altMobile:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        address:
          type: string
        mandal:
          type: string
        kshetra:
          type: string
        expectedContacts:
          type: integer
          minimum: 0

    Sevak:
      type: object
      required:
        - id
        - sevakCode
        - fullName
        - firstName
        - lastName
        - mobile
        - address
        - mandal
        - kshetra
        - expectedContacts
        - createdAt
        - updatedAt
