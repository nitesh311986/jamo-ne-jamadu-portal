      properties:
        totalEligibleBoxes:
          type: integer
          minimum: 0
        totalDistributedBoxes:
          type: integer
          minimum: 0
        balanceBoxes:
          type: integer
          minimum: 0

    DashboardActivity:
      type: object
      required:
        - type
