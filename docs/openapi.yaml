        - totalReceiptsCount
      properties:
        totalSevaks:
          type: integer
          minimum: 0
        totalAllocatedBooks:
          type: integer
          minimum: 0
        totalSubmittedBooks:
          type: integer
          minimum: 0
        totalPartiallySubmittedBooks:
          type: integer
          minimum: 0
        pendingBooks:
          type: integer
          minimum: 0
        totalSubmittedAmount:
          type: number
          minimum: 0
        totalReceiptsCount:
