openapi: 3.0.3
info:
  title: BAPS Anand Jamo Ne Jamadu Seva Portal API
  description: Module 3 (Books & Receipts) OpenAPI specification
  version: 3.0.0
  contact:
    name: BAPS Anand Mandir

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: Authenticate a user and receive a JWT
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get the current authenticated user
      operationId: getMe
      tags:
        - Auth
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/users:
    get:
      summary: List all users (SUPER_ADMIN only)
      operationId: listUsers
      tags:
        - Auth
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new user (SUPER_ADMIN only)
      operationId: createUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks:
    post:
      summary: Register a new sevak
      operationId: createSevak
      tags:
        - Sevaks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSevakRequest'
      responses:
        '201':
          description: Sevak registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/search:
    get:
      summary: Search sevaks by code, mobile, or name
      operationId: searchSevaks
      tags:
        - Sevaks
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevakSearchResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sevaks/export/excel:
    get:
      summary: Download all sevaks as an Excel file
      operationId: exportSevaksExcel
      tags:
        - Sevaks
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/assign:
    post:
      summary: Assign a book number to a sevak
      operationId: assignBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignBookRequest'
      responses:
        '201':
          description: Book assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Book number already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/sevak/{sevakId}:
    get:
      summary: List books assigned to a sevak
      operationId: getBooksBySevak
      tags:
        - Books
      parameters:
        - in: path
          name: sevakId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of book allocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts:
    post:
      summary: Create one or many receipts
      operationId: createReceipts
      tags:
        - Receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptsRequest'
      responses:
        '201':
          description: Receipts created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate receipt or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/search:
    get:
      summary: Search receipts by book, number, donor, or mobile
      operationId: searchReceipts
      tags:
        - Receipts
      parameters:
        - in: query
          name: bookNumber
          schema:
            type: string
        - in: query
          name: receiptNo
          schema:
            type: string
        - in: query
          name: donorName
          schema:
            type: string
        - in: query
          name: donorMobile
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSearchResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/sevak/{sevakId}/summary:
    get:
      summary: Real-time receipt aggregation for a sevak
      operationId: getSevakReceiptSummary
      tags:
        - Receipts
      parameters:
        - in: path
          name: sevakId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary with denomination breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSummaryResponse'
        '404':
          description: Sevak not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /receipts/export/excel:
    get:
      summary: Export all receipts with a summary sheet
      operationId: exportReceiptsExcel
      tags:
        - Receipts
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    CreateUserRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - VOLUNTEER

    User:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - VOLUNTEER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    CreateSevakRequest:
      type: object
      required:
        - fullName
        - firstName
        - lastName
        - mobile
        - address
        - mandal
        - kshetra
        - expectedContacts
      properties:
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        altMobile:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        address:
          type: string
        mandal:
          type: string
        kshetra:
          type: string
        expectedContacts:
          type: integer
          minimum: 0

    Sevak:
      type: object
      required:
        - id
        - sevakCode
        - fullName
        - firstName
        - lastName
        - mobile
        - address
        - mandal
        - kshetra
        - expectedContacts
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sevakCode:
          type: string
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        altMobile:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        address:
          type: string
        mandal:
          type: string
        kshetra:
          type: string
        expectedContacts:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SevakResponse:
      type: object
      required:
        - sevak
      properties:
        sevak:
          $ref: '#/components/schemas/Sevak'

    SevakSearchResponse:
      type: object
      required:
        - sevaks
        - total
        - page
        - limit
      properties:
        sevaks:
          type: array
          items:
            $ref: '#/components/schemas/Sevak'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AssignBookRequest:
      type: object
      required:
        - bookNumber
        - sevakId
      properties:
        bookNumber:
          type: string
        sevakId:
          type: string
          format: uuid

    BookAllocation:
      type: object
      required:
        - id
        - bookNumber
        - sevakId
        - status
        - assignedAt
      properties:
        id:
          type: string
          format: uuid
        bookNumber:
          type: string
        sevakId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ASSIGNED
            - SUBMITTED
            - PARTIALLY_SUBMITTED
        assignedAt:
          type: string
          format: date-time

    BookResponse:
      type: object
      required:
        - book
      properties:
        book:
          $ref: '#/components/schemas/BookAllocation'

    BookListResponse:
      type: object
      required:
        - books
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookAllocation'

    CreateReceiptsRequest:
      type: object
      required:
        - sevakId
        - receipts
      properties:
        sevakId:
          type: string
          format: uuid
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'

    ReceiptItem:
      type: object
      required:
        - bookNumber
        - receiptNo
        - donorName
        - amount
      properties:
        sevakId:
          type: string
          format: uuid
        bookNumber:
          type: string
        receiptNo:
          type: string
        donorName:
          type: string
        donorMobile:
          type: string
          nullable: true
        amount:
          type: number
          minimum: 0
        entryDate:
          type: string
          format: date-time
          nullable: true

    ReceiptCreateResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer

    Receipt:
      type: object
      required:
        - id
        - sevakId
        - bookNumber
        - receiptNo
        - donorName
        - amount
        - entryDate
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sevakId:
          type: string
          format: uuid
        bookNumber:
          type: string
        receiptNo:
          type: string
        donorName:
          type: string
        donorMobile:
          type: string
          nullable: true
        amount:
          type: number
        entryDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        sevak:
          $ref: '#/components/schemas/SevakStub'

    SevakStub:
      type: object
      required:
        - sevakCode
        - fullName
        - mandal
      properties:
        sevakCode:
          type: string
        fullName:
          type: string
        mandal:
          type: string

    ReceiptSearchResponse:
      type: object
      required:
        - receipts
        - total
        - page
        - limit
      properties:
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ReceiptSummaryGroup:
      type: object
      required:
        - amount
        - count
        - subTotal
      properties:
        amount:
          type: number
        count:
          type: integer
        subTotal:
          type: number

    ReceiptSummaryResponse:
      type: object
      required:
        - sevak
        - groups
        - grandTotal
        - totalCount
      properties:
        sevak:
          $ref: '#/components/schemas/SevakStub'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptSummaryGroup'
        grandTotal:
          type: number
        totalCount:
          type: integer

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
