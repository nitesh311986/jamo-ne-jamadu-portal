          type: string
        receiptNo:
          type: string
        donorName:
          type: string
        donorMobile:
          type: string
          nullable: true
        amount:
          type: number
          minimum: 0
        entryDate:
          type: string
          format: date-time
          nullable: true

    BulkSyncResponse:
      type: object
      required:
        - sevak
        - receipts
        - summary
      properties:
        sevak:
          $ref: '#/components/schemas/SevakStub'
        receipts:
