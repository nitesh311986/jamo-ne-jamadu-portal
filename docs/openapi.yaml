          type: number

    DashboardDenominationPoint:
      type: object
      required:
        - tier
        - count
        - amount
      properties:
        tier:
          type: string
        count:
          type: integer
        amount:
          type: number

    SevakBookRecord:
      allOf:
        - $ref: '#/components/schemas/Sevak'
        - type: object
          required:
            - totalAllocatedCount
            - submittedCount
            - partialCount
            - stillAssignedCount
            - totalSevaAmount
            - submittedBooks
            - partialBooks
            - assignedOnlyBooks
          properties:
            totalAllocatedCount:
              type: integer
              minimum: 0
            submittedCount:
              type: integer
              minimum: 0
            partialCount:
              type: integer
              minimum: 0
            stillAssignedCount:
              type: integer
              minimum: 0
            totalSevaAmount:
              type: number
              minimum: 0
            submittedBooks:
              type: array
              items:
                type: object
                required:
                  - bookNumber
                  - receiptCount
                  - totalAmount
                  - sahSevakName
                  - sahSevakMobile
                  - receipts
                properties:
                  bookNumber:
                    type: string
                  receiptCount:
                    type: integer
                  totalAmount:
                    type: number
                  sahSevakName:
                    type: string
                    nullable: true
                  sahSevakMobile:
                    type: string
                    nullable: true
                  receipts:
                    type: array
                    items:
                      $ref: '#/components/schemas/SevakBookReceiptSummary'
            partialBooks:
              type: array
              items:
                type: object
                required:
                  - bookNumber
                  - receiptCount
                  - remainingCount
                  - totalAmount
                  - sahSevakName
                  - sahSevakMobile
                  - receipts
                properties:
                  bookNumber:
                    type: string
                  receiptCount:
                    type: integer
                  remainingCount:
                    type: integer
                  totalAmount:
                    type: number
                  sahSevakName:
                    type: string
                    nullable: true
                  sahSevakMobile:
                    type: string
                    nullable: true
                  receipts:
                    type: array
                    items:
                      $ref: '#/components/schemas/SevakBookReceiptSummary'
            assignedOnlyBooks:
              type: array
              items:
                type: object
                required:
                  - bookNumber
                  - receiptCount
                  - sahSevakName
                  - sahSevakMobile
                properties:
                  bookNumber:
                    type: string
                  receiptCount:
                    type: integer
                  sahSevakName:
                    type: string
                    nullable: true
                  sahSevakMobile:
                    type: string
                    nullable: true

    SevakBookReceiptSummary:
      type: object
      required:
        - id
        - bookNumber
        - receiptNo
        - donorName
        - donorMobile
        - amount
        - entryDate
      properties:
        id:
          type: string
        bookNumber:
          type: string
        receiptNo:
          type: string
        donorName:
          type: string
        donorMobile:
          type: string
        amount:
          type: number
        entryDate:
          type: string
          format: date-time

    SevakBookRecordsResponse:
      type: object
      required:
        - success
        - data
        - pagination
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/SevakBookRecord'
        pagination:
          type: object
          required:
            - totalCount
            - totalPages
            - currentPage
            - pageSize
          properties:
            totalCount:
              type: integer
            totalPages:
              type: integer
            currentPage:
              type: integer
            pageSize:
              type: integer

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
